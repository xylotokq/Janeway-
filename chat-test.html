<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>小臭 Chat Test</title>
<style>
:root{
  --app-height:100dvh;
  --safe-bottom:env(safe-area-inset-bottom);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#0b0f14;
  color:#f3f6fa;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  overflow:hidden;
}

body.keyboard-open{
  --safe-bottom:0px;
}

.app{
  width:100%;
  height:var(--app-height);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#0b0f14;
}

.header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:#0d1117;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  display:grid;
  place-items:center;
  color:#111;
  font-size:24px;
  flex:0 0 auto;
}

.header-main{
  min-width:0;
  flex:1;
}

.header-title{
  font-size:18px;
  font-weight:750;
  line-height:1.15;
}

.header-sub{
  margin-top:4px;
  font-size:12px;
  color:#8b96a5;
}

.status{
  flex:0 0 auto;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid rgba(69,210,102,.35);
  color:#8de59f;
  background:rgba(34,129,56,.12);
  font-size:12px;
}

.messages{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  touch-action:pan-y;
  padding:14px 14px 18px;
  scroll-behavior:auto;
}

.stream{
  min-height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:12px;
}

.row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.row.user{
  justify-content:flex-end;
}

.mini-avatar{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#fff;
  display:grid;
  place-items:center;
  color:#111;
  font-size:16px;
  flex:0 0 auto;
}

.bubble{
  max-width:78%;
  padding:11px 13px;
  border-radius:18px;
  font-size:16px;
  line-height:1.48;
  word-break:break-word;
  white-space:pre-wrap;
}

.assistant .bubble{
  background:#171d24;
  border:1px solid #28313b;
  border-bottom-left-radius:6px;
}

.user .bubble{
  background:#2f80ed;
  border-bottom-right-radius:6px;
}

.composer{
  flex:0 0 auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:8px 12px calc(8px + var(--safe-bottom));
  border-top:1px solid rgba(255,255,255,.08);
  background:#0d1117;
}

.input-shell{
  min-width:0;
  flex:1;
  border:1px solid #303945;
  border-radius:18px;
  background:#12171d;
  padding:0;
  overflow:hidden;
}

textarea{
  display:block;
  width:100%;
  min-height:44px;
  max-height:112px;
  padding:11px 13px;
  border:0;
  outline:0;
  resize:none;
  overflow-y:auto;
  background:transparent;
  color:#f2f5f8;
  font:inherit;
  font-size:16px;
  line-height:1.4;
}

textarea::placeholder{
  color:#798493;
}

.send{
  flex:0 0 auto;
  height:44px;
  min-width:68px;
  border:0;
  border-radius:14px;
  padding:0 16px;
  background:#20a33a;
  color:#fff;
  font-size:16px;
  font-weight:700;
}

.debug{
  position:fixed;
  top:4px;
  right:4px;
  z-index:9999;
  pointer-events:none;
  font-size:9px;
  line-height:1.25;
  color:rgba(255,255,255,.36);
  text-align:right;
}

@media(min-width:701px){
  body{
    display:grid;
    place-items:center;
    background:#070a0e;
  }
  .app{
    width:430px;
    max-height:860px;
    border:1px solid #242c35;
    border-radius:22px;
    overflow:hidden;
  }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="avatar">🐻</div>
    <div class="header-main">
      <div class="header-title">小臭</div>
      <div class="header-sub">iPhone 聊天交互测试页</div>
    </div>
    <div class="status">● 在线</div>
  </header>

  <main class="messages" id="messages">
    <div class="stream" id="stream">
      <div class="row assistant">
        <div class="mini-avatar">🐻</div>
        <div class="bubble">这个页面只测试聊天交互，不连接 AI。你可以上下滑聊天、点输入框、打开键盘，然后继续滑聊天记录。</div>
      </div>

      <div class="row user">
        <div class="bubble">我想测试一下键盘。</div>
      </div>

      <div class="row assistant">
        <div class="mini-avatar">🐻</div>
        <div class="bubble">直接点下面输入框。理想效果是：键盘一出现，输入框自然在键盘上方；聊天记录仍然可以上下滑，不需要手动把页面再推一下。</div>
      </div>

      <div class="row user"><div class="bubble">消息 1</div></div>
      <div class="row assistant"><div class="mini-avatar">🐻</div><div class="bubble">这是一些测试消息，用来保证聊天区本身有足够内容可以滚动。</div></div>
      <div class="row user"><div class="bubble">消息 2</div></div>
      <div class="row assistant"><div class="mini-avatar">🐻</div><div class="bubble">你可以先往上滑，再点输入框；也可以保持在最底部直接点输入框。</div></div>
      <div class="row user"><div class="bubble">消息 3</div></div>
      <div class="row assistant"><div class="mini-avatar">🐻</div><div class="bubble">如果键盘弹出后这个输入框仍然需要手动滑一下才能出现，那么我们就知道是 iOS viewport 行为，而不是正式 App 的其他代码导致。</div></div>
      <div id="bottom"></div>
    </div>
  </main>

  <footer class="composer" id="composer">
    <div class="input-shell">
      <textarea id="input" rows="1" placeholder="告诉小臭你的训练目标或问题…"></textarea>
    </div>
    <button class="send" id="send">发送</button>
  </footer>
</div>

<div class="debug" id="debug"></div>

<script>
const app=document.getElementById("app");
const messages=document.getElementById("messages");
const stream=document.getElementById("stream");
const input=document.getElementById("input");
const send=document.getElementById("send");
const debug=document.getElementById("debug");

let stickBottom=true;
let baselineHeight=0;

function nearBottom(px=80){
  return messages.scrollHeight-messages.scrollTop-messages.clientHeight<=px;
}

function scrollBottom(){
  requestAnimationFrame(()=>{
    messages.scrollTop=messages.scrollHeight;
  });
}

function syncViewport(){
  const vv=window.visualViewport;
  const h=Math.round(vv?.height||window.innerHeight);
  const top=Math.round(vv?.offsetTop||0);

  if(document.activeElement!==input){
    baselineHeight=Math.max(baselineHeight,h);
  }
  if(!baselineHeight)baselineHeight=h;

  document.documentElement.style.setProperty("--app-height",h+"px");

  const keyboardOpen=document.activeElement===input && h < baselineHeight-80;
  document.body.classList.toggle("keyboard-open",keyboardOpen);

  debug.textContent=
    "vv.height "+h+
    "\noffsetTop "+top+
    "\ninnerHeight "+window.innerHeight+
    "\nbaseline "+baselineHeight+
    "\nkeyboard "+keyboardOpen;

  if(stickBottom)scrollBottom();
}

messages.addEventListener("scroll",()=>{
  stickBottom=nearBottom();
},{passive:true});

messages.addEventListener("touchstart",()=>{
  stickBottom=nearBottom(40);
},{passive:true});

input.addEventListener("input",()=>{
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,112)+"px";
  if(stickBottom)scrollBottom();
});

input.addEventListener("focus",()=>{
  stickBottom=nearBottom(140);

  /* Re-read visualViewport through the keyboard animation.
     No fixed positioning, no bottom offset, no scrollIntoView. */
  [0,40,90,160,260,400,600].forEach(ms=>{
    setTimeout(syncViewport,ms);
  });
});

input.addEventListener("blur",()=>{
  [0,80,180,320].forEach(ms=>{
    setTimeout(syncViewport,ms);
  });
});

if(window.visualViewport){
  visualViewport.addEventListener("resize",syncViewport,{passive:true});
  visualViewport.addEventListener("scroll",syncViewport,{passive:true});
}
window.addEventListener("resize",syncViewport,{passive:true});

send.addEventListener("click",()=>{
  const text=input.value.trim();
  if(!text)return;

  const row=document.createElement("div");
  row.className="row user";
  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=text;
  row.appendChild(bubble);
  stream.insertBefore(row,document.getElementById("bottom"));

  input.value="";
  input.style.height="44px";
  stickBottom=true;
  scrollBottom();

  setTimeout(()=>{
    const reply=document.createElement("div");
    reply.className="row assistant";
    reply.innerHTML='<div class="mini-avatar">🐻</div><div class="bubble">收到。这是一条本地测试回复，没有请求网络。</div>';
    stream.insertBefore(reply,document.getElementById("bottom"));
    if(stickBottom)scrollBottom();
  },250);
});

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    send.click();
  }
});

syncViewport();
scrollBottom();
</script>
</body>
</html>
